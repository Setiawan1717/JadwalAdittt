<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer - Kuliah & Organisasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Kustomisasi scrollbar agar terlihat rapi */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen overflow-hidden flex flex-col md:flex-row">

    <!-- Navigasi Ruang / Konteks -->
    <nav class="bg-white border-r border-gray-200 md:w-64 flex-shrink-0 flex flex-col h-auto md:h-full z-10 shadow-sm md:shadow-none">
        <div class="p-4 border-b border-gray-200 flex items-center justify-between">
            <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                <i class="ph-fill ph-compass text-indigo-600"></i> Jadwal Adittt
            </h1>
        </div>
        
        <!-- List Konteks -->
        <div class="p-4 flex-1 overflow-y-auto hide-scroll flex md:flex-col gap-2 flex-row w-full md:w-auto" id="context-list">
            <!-- Rendered via JS -->
        </div>
    </nav>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        
        <!-- Header -->
        <header class="bg-white/80 backdrop-blur-md border-b border-gray-200 p-4 lg:px-8 flex items-center justify-between sticky top-0 z-10">
            <div>
                <h2 class="text-2xl font-bold text-gray-800" id="current-context-title">Semua Agenda</h2>
                <p class="text-sm text-gray-500" id="current-date-display"></p>
            </div>
            <div class="flex gap-2">
                <button onclick="openModal('agenda-modal')" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-4 py-2 rounded-lg font-medium text-sm transition-colors flex items-center gap-2">
                    <i class="ph ph-calendar-plus"></i> <span class="hidden sm:inline">Rapat Baru</span>
                </button>
                <button onclick="openModal('task-modal')" class="bg-indigo-600 text-white hover:bg-indigo-700 px-4 py-2 rounded-lg font-medium text-sm transition-colors flex items-center gap-2 shadow-sm">
                    <i class="ph ph-plus-circle"></i> <span class="hidden sm:inline">Tugas Baru</span>
                </button>
                <button onclick="openModal('note-modal')" class="bg-amber-100 text-amber-700 hover:bg-amber-200 px-4 py-2 rounded-lg font-medium text-sm transition-colors flex items-center gap-2 shadow-sm">
                    <i class="ph ph-note-pencil"></i> <span class="hidden sm:inline">Catatan</span>
                </button>
            </div>
        </header>

        <!-- Area Scrollable Konten -->
        <div class="flex-1 overflow-y-auto p-4 lg:p-8 space-y-8 pb-24">
            
            <!-- Section: Deadline Terdekat -->
            <section id="deadline-section" class="bg-red-50 border border-red-100 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center gap-2 mb-4 text-red-700">
                    <i class="ph-fill ph-warning-circle text-xl"></i>
                    <h3 class="font-bold text-lg">Deadline Mendekat</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="urgent-tasks-container">
                    <!-- Rendered via JS -->
                </div>
            </section>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Kolom Kiri: Agenda / Rapat (Lebih lebar) -->
                <div class="lg:col-span-2 space-y-4">
                    <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                        <i class="ph-fill ph-calendar-blank text-indigo-500"></i> Jadwal Rapat & Agenda
                    </h3>
                    <div id="agendas-container" class="space-y-4">
                        <!-- Rendered via JS -->
                    </div>
                </div>

                <!-- Kolom Kanan: Semua Tugas Tertunda & Catatan -->
                <div class="space-y-8">
                    <!-- Daftar Tugas -->
                    <div class="space-y-4">
                        <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                            <i class="ph-fill ph-list-checks text-emerald-500"></i> Daftar Tugas
                        </h3>
                        <div id="all-tasks-container" class="space-y-3">
                            <!-- Rendered via JS -->
                        </div>
                    </div>
                    
                    <!-- Catatan Cepat -->
                    <div class="space-y-4">
                        <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                            <i class="ph-fill ph-note-pencil text-amber-500"></i> Catatan
                        </h3>
                        <div id="notes-container" class="space-y-3">
                            <!-- Rendered via JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- OVERLAY MODAL UMUM -->
    <div id="modal-overlay" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        
        <!-- MODAL TAMBAH AGENDA -->
        <div id="agenda-modal" class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform duration-300 hidden flex-col max-h-[90vh]">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 id="agenda-modal-title" class="font-bold text-lg">Tambah Agenda Rapat</h3>
                <button onclick="closeModals()" class="text-gray-400 hover:text-gray-600"><i class="ph ph-x text-xl"></i></button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ruang / Organisasi <span class="text-red-500">*</span></label>
                    <select id="agenda-context" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Judul Agenda <span class="text-red-500">*</span></label>
                    <input type="text" id="agenda-title" placeholder="Cth: Rapat Pleno BEM" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Waktu Pelaksanaan <span class="text-red-500">*</span></label>
                    <input type="datetime-local" id="agenda-datetime" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Catatan / Notulensi Rapat</label>
                    <textarea id="agenda-notes" rows="4" placeholder="Tuliskan poin penting, hasil keputusan, atau link Gmeet di sini..." class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-none"></textarea>
                </div>
            </div>
            <div class="p-5 border-t border-gray-100 bg-gray-50 flex justify-end gap-2">
                <button onclick="closeModals()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-200 rounded-lg transition-colors">Batal</button>
                <button id="agenda-modal-btn" onclick="saveAgenda()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors">Simpan Agenda</button>
            </div>
        </div>

        <!-- MODAL TAMBAH TUGAS -->
        <div id="task-modal" class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-300 hidden flex-col">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 id="task-modal-title" class="font-bold text-lg">Tambah Tugas Baru</h3>
                <button onclick="closeModals()" class="text-gray-400 hover:text-gray-600"><i class="ph ph-x text-xl"></i></button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ruang / Organisasi <span class="text-red-500">*</span></label>
                    <select id="task-context" onchange="updateTaskFormUI()" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white"></select>
                </div>
                <div>
                    <label id="task-related-label" class="block text-sm font-medium text-gray-700 mb-1">Agenda apa?</label>
                    <input type="text" id="task-related-input" placeholder="Tuliskan di sini..." class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tugasnya ngapain? <span class="text-red-500">*</span></label>
                    <input type="text" id="task-title" placeholder="Cth: Buat draft proposal" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Deadline <span class="text-red-500">*</span></label>
                    <input type="datetime-local" id="task-deadline" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>
            <div class="p-5 border-t border-gray-100 bg-gray-50 flex justify-end gap-2">
                <button onclick="closeModals()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-200 rounded-lg transition-colors">Batal</button>
                <button id="task-modal-btn" onclick="saveTask()" class="px-4 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg transition-colors">Simpan Tugas</button>
            </div>
        </div>

        <!-- MODAL TAMBAH CATATAN -->
        <div id="note-modal" class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-300 hidden flex-col">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 id="note-modal-title" class="font-bold text-lg">Tambah Catatan</h3>
                <button onclick="closeModals()" class="text-gray-400 hover:text-gray-600"><i class="ph ph-x text-xl"></i></button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ruang / Organisasi <span class="text-red-500">*</span></label>
                    <select id="note-context" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Judul Catatan <span class="text-red-500">*</span></label>
                    <input type="text" id="note-title" placeholder="Cth: Ide proker baru..." class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Isi Catatan <span class="text-red-500">*</span></label>
                    <textarea id="note-content" rows="4" placeholder="Tulis ide, uneg-uneg, atau pengingat bebas di sini..." class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 resize-none"></textarea>
                </div>
            </div>
            <div class="p-5 border-t border-gray-100 bg-gray-50 flex justify-end gap-2">
                <button onclick="closeModals()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-200 rounded-lg transition-colors">Batal</button>
                <button id="note-modal-btn" onclick="saveNote()" class="px-4 py-2 text-sm font-medium text-white bg-amber-500 hover:bg-amber-600 rounded-lg transition-colors">Simpan Catatan</button>
            </div>
        </div>

        <!-- MODAL DETAIL AGENDA -->
        <div id="detail-modal" class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden transform scale-95 transition-transform duration-300 hidden flex-col max-h-[90vh]">
            <div class="p-5 border-b border-gray-100 flex justify-between items-start bg-gray-50/50">
                <div>
                    <span id="detail-context-badge" class="text-xs font-semibold px-2 py-1 rounded-md mb-2 inline-block">Konteks</span>
                    <h3 id="detail-title" class="font-bold text-xl text-gray-900 leading-tight">Judul</h3>
                    <p id="detail-time" class="text-sm text-gray-500 mt-1 flex items-center gap-1"><i class="ph ph-clock"></i> Waktu</p>
                </div>
                <button onclick="closeModals()" class="text-gray-400 hover:text-gray-600 bg-gray-100 hover:bg-gray-200 p-1.5 rounded-lg"><i class="ph ph-x text-xl"></i></button>
            </div>
            <div class="p-5 overflow-y-auto space-y-6 flex-1 bg-white">
                <div>
                    <h4 class="font-semibold text-gray-700 flex items-center gap-1.5 mb-2"><i class="ph-fill ph-notebook text-indigo-500"></i> Catatan & Notulensi</h4>
                    <div id="detail-notes" class="bg-gray-50 border border-gray-100 rounded-xl p-4 text-gray-700 text-sm whitespace-pre-wrap min-h-[100px]"></div>
                </div>
                <div>
                    <h4 class="font-semibold text-gray-700 flex items-center gap-1.5 mb-2"><i class="ph-fill ph-check-square-offset text-emerald-500"></i> Tugas Terkait Agenda Ini</h4>
                    <div id="detail-tasks" class="space-y-2"></div>
                </div>
            </div>
        </div>
        
    </div>

    <!-- Custom Notifikasi -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-3 rounded-lg shadow-xl text-sm font-medium flex items-center gap-2 transition-all duration-300 opacity-0 translate-y-5 pointer-events-none z-50">
        <i class="ph-fill ph-check-circle text-emerald-400 text-lg"></i>
        <span id="toast-message">Berhasil disimpan!</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Cloud Storage
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        let db, auth, userId;

        // --- 1. DATA STRUCTURE (State Lokal) ---
        
        const contexts = [
            { id: 1, name: "Semester 5", color: "blue", icon: "ph-student" },
            { id: 2, name: "BEM Universitas", color: "purple", icon: "ph-users-three" },
            { id: 3, name: "Koperasi Mahasiswa", color: "orange", icon: "ph-pen-nib" },
            { id: 4, name: "Biru Kuning", color: "green", icon: "ph-flag-banner" }
        ];

        const getColors = (colorStr) => {
            const map = {
                blue: { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-200', active: 'bg-blue-600 text-white' },
                purple: { bg: 'bg-purple-100', text: 'text-purple-700', border: 'border-purple-200', active: 'bg-purple-600 text-white' },
                orange: { bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-200', active: 'bg-orange-600 text-white' },
                green: { bg: 'bg-green-100', text: 'text-green-700', border: 'border-green-200', active: 'bg-green-600 text-white' },
                gray: { bg: 'bg-gray-100', text: 'text-gray-700', border: 'border-gray-200', active: 'bg-gray-800 text-white' }
            };
            return map[colorStr] || map.gray;
        };

        // Arrays akan diisi dari Cloud Storage
        let agendas = [];
        let tasks = [];
        let notes = [];

        // State Global
        let activeContextId = null; 
        let editingAgendaId = null;
        let editingTaskId = null;
        let editingNoteId = null;

        // --- Inisialisasi Aplikasi ---
        async function initApp() {
            // Set tanggal hari ini di header
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date-display').innerText = today.toLocaleDateString('id-ID', options);

            renderSidebar();
            populateSelectInputs();
            renderDashboard();

            // Inisialisasi Cloud Storage
            if (Object.keys(firebaseConfig).length > 0) {
                try {
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    if (typeof __initial_auth_token !== 'undefined') {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    userId = auth.currentUser.uid;
                    setupCloudListeners();
                    showToast("Terhubung ke penyimpanan awan!");
                } catch (error) {
                    console.error("Gagal terhubung:", error);
                    showToast("Sistem berjalan secara offline");
                }
            }
        }

        // --- 2. LOGIKA CLOUD STORAGE ---
        function setupCloudListeners() {
            if (!userId) return;

            // Dengarkan perubahan Agendas
            onSnapshot(collection(db, 'artifacts', appId, 'users', userId, 'agendas'), (snapshot) => {
                agendas = [];
                snapshot.forEach(doc => agendas.push({ id: doc.id, ...doc.data() }));
                renderDashboard();
            }, (error) => console.error("Error agendas:", error));

            // Dengarkan perubahan Tasks
            onSnapshot(collection(db, 'artifacts', appId, 'users', userId, 'tasks'), (snapshot) => {
                tasks = [];
                snapshot.forEach(doc => tasks.push({ id: doc.id, ...doc.data() }));
                renderDashboard();
            }, (error) => console.error("Error tasks:", error));

            // Dengarkan perubahan Notes
            onSnapshot(collection(db, 'artifacts', appId, 'users', userId, 'notes'), (snapshot) => {
                notes = [];
                snapshot.forEach(doc => notes.push({ id: doc.id, ...doc.data() }));
                renderDashboard();
            }, (error) => console.error("Error notes:", error));
        }

        // --- 3. LOGIKA RENDERING UI ---
        function renderSidebar() {
            const list = document.getElementById('context-list');
            list.innerHTML = '';

            const allBtn = document.createElement('button');
            const isAllActive = activeContextId === null;
            allBtn.className = `flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium whitespace-nowrap md:whitespace-normal w-auto md:w-full text-left
                ${isAllActive ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'}`;
            allBtn.innerHTML = `<i class="ph-fill ph-squares-four text-xl"></i> <span>Semua Agenda</span>`;
            allBtn.onclick = () => switchContext(null);
            list.appendChild(allBtn);

            contexts.forEach(ctx => {
                const isActive = activeContextId === ctx.id;
                const colors = getColors(ctx.color);
                const btn = document.createElement('button');
                
                let activeClasses = isActive ? colors.active + ' shadow-md scale-100' : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900 scale-95 hover:scale-100';
                
                btn.className = `flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium whitespace-nowrap md:whitespace-normal w-auto md:w-full text-left ${activeClasses}`;
                btn.innerHTML = `<i class="ph-fill ${ctx.icon} text-xl ${isActive ? 'text-white' : colors.text}"></i> <span>${ctx.name}</span>`;
                btn.onclick = () => switchContext(ctx.id);
                list.appendChild(btn);
            });
        }

        function switchContext(id) {
            activeContextId = id;
            renderSidebar();
            
            const titleEl = document.getElementById('current-context-title');
            if (id === null) {
                titleEl.innerText = "Semua Agenda";
            } else {
                const ctx = contexts.find(c => c.id === id);
                titleEl.innerText = ctx.name;
            }
            
            renderDashboard();
        }

        function renderDashboard() {
            renderUrgentTasks();
            renderAgendas();
            renderAllTasks();
            renderNotes();
        }

        function formatDateTime(isoString) {
            const d = new Date(isoString);
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) + ', ' + 
                   d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        function renderUrgentTasks() {
            const container = document.getElementById('urgent-tasks-container');
            const section = document.getElementById('deadline-section');
            container.innerHTML = '';
            
            const now = new Date();
            let filteredTasks = tasks
                .filter(t => !t.isDone && (activeContextId === null || t.contextId === activeContextId))
                .sort((a, b) => new Date(a.deadline) - new Date(b.deadline))
                .slice(0, 3);

            if (filteredTasks.length === 0) {
                section.classList.add('hidden');
                return;
            }
            
            section.classList.remove('hidden');

            filteredTasks.forEach(task => {
                const ctx = contexts.find(c => c.id === task.contextId);
                const colors = getColors(ctx.color);
                
                const isOverdue = new Date(task.deadline) < now;
                const timeColor = isOverdue ? 'text-red-600 font-bold' : 'text-gray-600';
                const timeIcon = isOverdue ? 'ph-warning-circle text-red-500' : 'ph-clock';

                const card = document.createElement('div');
                card.className = `bg-white p-4 rounded-xl border ${colors.border} shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow relative overflow-hidden`;
                card.innerHTML = `
                    <div class="absolute top-0 left-0 w-1 h-full ${colors.bg.replace('100', '400')}"></div>
                    <div class="flex justify-between items-start mb-2 pl-2">
                        <span class="text-xs font-semibold px-2 py-1 rounded-md ${colors.bg} ${colors.text}">${ctx.name}</span>
                        <button onclick="toggleTaskStatus('${task.id}')" class="text-gray-300 hover:text-emerald-500 transition-colors" title="Tandai Selesai">
                            <i class="ph ph-circle text-2xl"></i>
                        </button>
                    </div>
                    <h4 class="font-bold text-gray-800 text-sm pl-2 mb-3 leading-tight">${task.title}</h4>
                    <div class="mt-auto pl-2 flex items-center gap-1.5 text-xs ${timeColor}">
                        <i class="ph-fill ${timeIcon}"></i> ${formatDateTime(task.deadline)}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderAgendas() {
            const container = document.getElementById('agendas-container');
            container.innerHTML = '';
            
            let filtered = agendas.filter(a => activeContextId === null || a.contextId === activeContextId)
                                  .sort((a,b) => new Date(a.datetime) - new Date(b.datetime));
                                  
            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-500 text-center py-6 bg-white rounded-xl border border-gray-100 border-dashed">Belum ada agenda rapat.</p>`;
                return;
            }
            
            filtered.forEach(agenda => {
                const ctx = contexts.find(c => c.id === agenda.contextId);
                const colors = getColors(ctx.color);
                
                const card = document.createElement('div');
                card.className = `bg-white p-4 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4 cursor-pointer group`;
                card.onclick = () => openDetailModal(agenda.id);
                card.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="h-12 w-12 rounded-xl ${colors.bg} ${colors.text} flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
                            <i class="ph-fill ph-calendar-blank text-2xl"></i>
                        </div>
                        <div class="pr-2">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-bold tracking-wide px-2 py-0.5 rounded-md ${colors.bg} ${colors.text}">${ctx.name}</span>
                            </div>
                            <h4 class="font-bold text-gray-800 group-hover:text-indigo-600 transition-colors">${agenda.title}</h4>
                            <p class="text-sm text-gray-500 flex items-center gap-1.5 mt-1"><i class="ph ph-clock"></i> ${formatDateTime(agenda.datetime)}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 sm:gap-2 mt-3 sm:mt-0 pt-3 sm:pt-0 border-t sm:border-t-0 border-gray-100 w-full sm:w-auto justify-end">
                        <button onclick="event.stopPropagation(); openDetailModal('${agenda.id}')" class="text-sm font-medium text-indigo-600 bg-indigo-50 px-4 py-2 rounded-lg hover:bg-indigo-100 whitespace-nowrap hidden sm:block">Detail</button>
                        <button onclick="event.stopPropagation(); editAgenda('${agenda.id}')" class="text-gray-400 hover:text-amber-500 p-2 rounded-md hover:bg-amber-50 transition-colors" title="Edit Agenda">
                            <i class="ph ph-pencil-simple text-lg"></i>
                        </button>
                        <button onclick="event.stopPropagation(); deleteAgenda('${agenda.id}')" class="text-gray-400 hover:text-red-500 p-2 rounded-md hover:bg-red-50 transition-colors" title="Hapus Agenda">
                            <i class="ph ph-trash text-lg"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderAllTasks() {
            const container = document.getElementById('all-tasks-container');
            container.innerHTML = '';
            
            let filtered = tasks.filter(t => activeContextId === null || t.contextId === activeContextId)
                                .sort((a,b) => new Date(a.deadline) - new Date(b.deadline));
                                
            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-500 text-center py-6 bg-white rounded-xl border border-gray-100 border-dashed">Belum ada tugas.</p>`;
                return;
            }
            
            filtered.forEach(task => {
                const ctx = contexts.find(c => c.id === task.contextId);
                const colors = getColors(ctx.color);
                const isOverdue = new Date(task.deadline) < new Date() && !task.isDone;
                
                const item = document.createElement('div');
                item.className = `bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm flex items-start gap-3 transition-all ${task.isDone ? 'opacity-50 bg-gray-50' : 'hover:border-gray-300 hover:shadow'}`;
                item.innerHTML = `
                    <button onclick="toggleTaskStatus('${task.id}')" class="mt-0.5 flex-shrink-0 transition-transform hover:scale-110 ${task.isDone ? 'text-emerald-500' : 'text-gray-300 hover:text-emerald-400'}">
                        <i class="ph-fill ${task.isDone ? 'ph-check-circle' : 'ph-circle'} text-[22px]"></i>
                    </button>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                            <span class="text-[10px] font-bold tracking-wide px-2 py-0.5 rounded-md ${colors.bg} ${colors.text}">${ctx.name}</span>
                            ${task.relatedTopic ? `<span class="text-xs text-gray-500 truncate flex items-center gap-1"><i class="ph ph-link"></i> ${task.relatedTopic}</span>` : ''}
                        </div>
                        <h4 class="font-semibold text-sm leading-snug ${task.isDone ? 'text-gray-500 line-through' : 'text-gray-800'}">${task.title}</h4>
                        <p class="text-xs flex items-center gap-1.5 mt-1.5 ${isOverdue ? 'text-red-500 font-semibold' : 'text-gray-500'}">
                            <i class="ph ${isOverdue ? 'ph-warning-circle' : 'ph-clock'}"></i> ${formatDateTime(task.deadline)}
                        </p>
                    </div>
                    <div class="flex gap-1 flex-shrink-0">
                        <button onclick="editTask('${task.id}')" class="text-gray-400 hover:text-amber-500 p-1.5 rounded-md hover:bg-amber-50 transition-colors" title="Edit Tugas">
                            <i class="ph ph-pencil-simple text-lg"></i>
                        </button>
                        <button onclick="deleteTask('${task.id}')" class="text-gray-400 hover:text-red-500 p-1.5 rounded-md hover:bg-red-50 transition-colors" title="Hapus Tugas">
                            <i class="ph ph-trash text-lg"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function renderNotes() {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';

            let filteredNotes = notes
                .filter(n => activeContextId === null || n.contextId === activeContextId)
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            if (filteredNotes.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-500 text-center py-4 bg-white rounded-xl border border-gray-100">Belum ada catatan.</p>`;
                return;
            }

            filteredNotes.forEach(note => {
                const ctx = contexts.find(c => c.id === note.contextId);
                const colors = getColors(ctx.color);
                
                const item = document.createElement('div');
                item.className = `bg-[#fefce8] p-4 rounded-xl border border-amber-200/50 shadow-sm relative group hover:shadow-md transition-all`;
                
                item.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-bold tracking-wide px-2 py-0.5 rounded ${colors.bg} ${colors.text}">${ctx.name}</span>
                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editNote('${note.id}')" class="text-gray-400 hover:text-amber-500 p-1 rounded hover:bg-amber-100/50" title="Edit Catatan">
                                 <i class="ph ph-pencil-simple"></i>
                            </button>
                            <button onclick="deleteNote('${note.id}')" class="text-gray-400 hover:text-red-500 p-1 rounded hover:bg-red-100/50" title="Hapus Catatan">
                                 <i class="ph ph-trash"></i>
                            </button>
                        </div>
                    </div>
                    <h4 class="font-bold text-gray-800 text-sm mb-1">${note.title}</h4>
                    <p class="text-sm text-gray-800 whitespace-pre-wrap leading-relaxed">${note.content}</p>
                `;
                container.appendChild(item);
            });
        }

        async function toggleTaskStatus(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                const newStatus = !task.isDone;
                if(userId) {
                    await updateDoc(doc(db, 'artifacts', appId, 'users', userId, 'tasks', id), { isDone: newStatus });
                } else {
                    task.isDone = newStatus;
                    renderDashboard();
                }
                
                // Re-render detail modal if open
                const detailModal = document.getElementById('detail-modal');
                if (!detailModal.classList.contains('hidden')) {
                    const activeAgendaId = detailModal.getAttribute('data-agenda-id');
                    if(activeAgendaId) openDetailModal(activeAgendaId);
                }
            }
        }

        async function deleteTask(id) {
            if(userId) {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'tasks', id));
            } else {
                tasks = tasks.filter(t => t.id !== id);
                renderDashboard();
            }
            showToast("Tugas dihapus");
        }

        async function deleteNote(id) {
            if(userId) {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'notes', id));
            } else {
                notes = notes.filter(n => n.id !== id);
                renderDashboard();
            }
            showToast("Catatan dihapus");
        }

        async function deleteAgenda(id) {
            const agenda = agendas.find(a => a.id === id);
            if(userId) {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'agendas', id));
                if (agenda) {
                    const relatedTasks = tasks.filter(t => t.relatedTopic && t.relatedTopic.toLowerCase() === agenda.title.toLowerCase());
                    for (const t of relatedTasks) {
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'tasks', t.id));
                    }
                }
            } else {
                agendas = agendas.filter(a => a.id !== id);
                if(agenda) {
                    tasks = tasks.filter(t => !(t.relatedTopic && t.relatedTopic.toLowerCase() === agenda.title.toLowerCase()));
                }
                renderDashboard();
            }
            showToast("Agenda & Tugas terkait dihapus");
        }

        // --- 4. FUNGSI EDIT & SAVE (CLOUD) ---
        function editAgenda(id) {
            const agenda = agendas.find(a => a.id === id);
            if (!agenda) return;
            
            editingAgendaId = id;
            populateSelectInputs(); 
            
            document.getElementById('agenda-context').value = agenda.contextId;
            document.getElementById('agenda-title').value = agenda.title;
            document.getElementById('agenda-datetime').value = agenda.datetime;
            document.getElementById('agenda-notes').value = agenda.notes || "";
            
            document.getElementById('agenda-modal-title').innerText = "Edit Agenda Rapat";
            document.getElementById('agenda-modal-btn').innerText = "Update Agenda";
            
            openModal('agenda-modal');
        }

        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            
            editingTaskId = id;
            populateSelectInputs();
            
            document.getElementById('task-context').value = task.contextId;
            updateTaskFormUI(); 
            document.getElementById('task-related-input').value = task.relatedTopic || "";
            document.getElementById('task-title').value = task.title;
            document.getElementById('task-deadline').value = task.deadline;
            
            document.getElementById('task-modal-title').innerText = "Edit Tugas";
            document.getElementById('task-modal-btn').innerText = "Update Tugas";
            
            openModal('task-modal');
        }

        function editNote(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            
            editingNoteId = id;
            populateSelectInputs();
            
            document.getElementById('note-context').value = note.contextId;
            document.getElementById('note-title').value = note.title;
            document.getElementById('note-content').value = note.content;
            
            document.getElementById('note-modal-title').innerText = "Edit Catatan";
            document.getElementById('note-modal-btn').innerText = "Update Catatan";
            
            openModal('note-modal');
        }

        function populateSelectInputs() {
            const agendaCtxSelect = document.getElementById('agenda-context');
            const taskCtxSelect = document.getElementById('task-context');
            const noteCtxSelect = document.getElementById('note-context');
            
            let optionsHtml = '';
            contexts.forEach(ctx => {
                optionsHtml += `<option value="${ctx.id}">${ctx.name}</option>`;
            });

            agendaCtxSelect.innerHTML = optionsHtml;
            taskCtxSelect.innerHTML = optionsHtml;
            noteCtxSelect.innerHTML = optionsHtml;
            
            if (activeContextId) {
                agendaCtxSelect.value = activeContextId;
                taskCtxSelect.value = activeContextId;
                noteCtxSelect.value = activeContextId;
            }
            
            updateTaskFormUI();
        }

        function updateTaskFormUI() {
            const taskCtxSelect = document.getElementById('task-context');
            const label = document.getElementById('task-related-label');
            const selectedCtxId = parseInt(taskCtxSelect.value);

            if (selectedCtxId === 1) { 
                label.innerHTML = 'Matakuliah apa?';
            } else {
                label.innerHTML = 'Agenda apa?';
            }
        }

        function openModal(modalId) {
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
            
            setTimeout(() => {
                document.getElementById('modal-overlay').classList.remove('opacity-0');
                document.getElementById(modalId).classList.remove('hidden');
                document.getElementById(modalId).classList.add('flex');
                setTimeout(() => {
                    document.getElementById(modalId).classList.remove('scale-95');
                }, 10);
            }, 10);

            if((modalId === 'agenda-modal' && !editingAgendaId) || 
               (modalId === 'task-modal' && !editingTaskId) || 
               (modalId === 'note-modal' && !editingNoteId)) {
                populateSelectInputs();
            }
        }

        function closeModals() {
            const overlay = document.getElementById('modal-overlay');
            const modals = ['agenda-modal', 'task-modal', 'note-modal', 'detail-modal'];
            
            modals.forEach(modalId => {
                const el = document.getElementById(modalId);
                el.classList.add('scale-95');
            });
            
            overlay.classList.add('opacity-0');
            
            setTimeout(() => {
                modals.forEach(modalId => {
                    const el = document.getElementById(modalId);
                    el.classList.add('hidden');
                    el.classList.remove('flex');
                });
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                
                document.getElementById('agenda-title').value = '';
                document.getElementById('agenda-datetime').value = '';
                document.getElementById('agenda-notes').value = '';
                document.getElementById('task-title').value = '';
                document.getElementById('task-related-input').value = '';
                document.getElementById('task-deadline').value = '';
                document.getElementById('note-title').value = '';
                document.getElementById('note-content').value = '';

                editingAgendaId = null;
                editingTaskId = null;
                editingNoteId = null;

                document.getElementById('agenda-modal-title').innerText = "Tambah Agenda Rapat";
                document.getElementById('agenda-modal-btn').innerText = "Simpan Agenda";
                document.getElementById('task-modal-title').innerText = "Tambah Tugas Baru";
                document.getElementById('task-modal-btn').innerText = "Simpan Tugas";
                document.getElementById('note-modal-title').innerText = "Tambah Catatan";
                document.getElementById('note-modal-btn').innerText = "Simpan Catatan";
            }, 300);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            
            toast.classList.remove('opacity-0', 'translate-y-5', 'pointer-events-none');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-5', 'pointer-events-none');
            }, 3000);
        }

        async function saveAgenda() {
            const ctxId = parseInt(document.getElementById('agenda-context').value);
            const title = document.getElementById('agenda-title').value.trim();
            const datetime = document.getElementById('agenda-datetime').value;
            const notesText = document.getElementById('agenda-notes').value.trim();

            if (!title || !datetime) {
                showToast("Oops! Mohon isi judul dan waktu agenda.");
                return;
            }

            const payload = { contextId: ctxId, title, datetime, notes: notesText };

            if (userId) {
                if (editingAgendaId) {
                    await updateDoc(doc(db, 'artifacts', appId, 'users', userId, 'agendas', editingAgendaId), payload);
                    showToast("Agenda berhasil diperbarui");
                } else {
                    const newId = crypto.randomUUID();
                    await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'agendas', newId), payload);
                    showToast("Agenda Rapat Berhasil Disimpan");
                }
            } else {
                if (editingAgendaId) {
                    const idx = agendas.findIndex(a => a.id === editingAgendaId);
                    if(idx !== -1) agendas[idx] = { ...agendas[idx], ...payload };
                } else {
                    agendas.push({ id: crypto.randomUUID(), ...payload });
                }
                renderDashboard();
                showToast("Mode Offline: Disimpan sementara di layar");
            }

            closeModals();
        }

        async function saveTask() {
            const ctxId = parseInt(document.getElementById('task-context').value);
            const relatedTopic = document.getElementById('task-related-input').value.trim();
            const title = document.getElementById('task-title').value.trim();
            const deadline = document.getElementById('task-deadline').value;

            if (!title || !deadline) {
                showToast("Oops! Mohon isi tugasnya dan deadline.");
                return;
            }

            const payload = { contextId: ctxId, relatedTopic, title, deadline };

            if (userId) {
                if (editingTaskId) {
                    await updateDoc(doc(db, 'artifacts', appId, 'users', userId, 'tasks', editingTaskId), payload);
                    showToast("Tugas berhasil diperbarui");
                } else {
                    const newId = crypto.randomUUID();
                    await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'tasks', newId), { ...payload, isDone: false });
                    showToast("Tugas Baru Berhasil Disimpan");
                }
            } else {
                if (editingTaskId) {
                    const idx = tasks.findIndex(t => t.id === editingTaskId);
                    if(idx !== -1) tasks[idx] = { ...tasks[idx], ...payload };
                } else {
                    tasks.push({ id: crypto.randomUUID(), ...payload, isDone: false });
                }
                renderDashboard();
                showToast("Mode Offline: Disimpan sementara di layar");
            }

            closeModals();
        }

        async function saveNote() {
            const ctxId = parseInt(document.getElementById('note-context').value);
            const title = document.getElementById('note-title').value.trim();
            const content = document.getElementById('note-content').value.trim();

            if (!title || !content) {
                showToast("Oops! Judul dan isi catatan wajib diisi.");
                return;
            }

            const payload = { contextId: ctxId, title, content };

            if (userId) {
                if (editingNoteId) {
                    await updateDoc(doc(db, 'artifacts', appId, 'users', userId, 'notes', editingNoteId), payload);
                    showToast("Catatan berhasil diperbarui");
                } else {
                    const newId = crypto.randomUUID();
                    await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'notes', newId), { ...payload, timestamp: new Date().toISOString() });
                    showToast("Catatan Berhasil Disimpan");
                }
            } else {
                if (editingNoteId) {
                    const idx = notes.findIndex(n => n.id === editingNoteId);
                    if(idx !== -1) notes[idx] = { ...notes[idx], ...payload };
                } else {
                    notes.push({ id: crypto.randomUUID(), ...payload, timestamp: new Date().toISOString() });
                }
                renderDashboard();
                showToast("Mode Offline: Disimpan sementara di layar");
            }

            closeModals();
        }

        function openDetailModal(agendaId) {
            const agenda = agendas.find(a => a.id === agendaId);
            if (!agenda) return;

            const ctx = contexts.find(c => c.id === agenda.contextId);
            const colors = getColors(ctx.color);

            const badge = document.getElementById('detail-context-badge');
            badge.className = `text-xs font-semibold px-2 py-1 rounded-md mb-2 inline-block ${colors.bg} ${colors.text}`;
            badge.innerText = ctx.name;
            
            document.getElementById('detail-title').innerText = agenda.title;
            document.getElementById('detail-time').innerHTML = `<i class="ph-fill ph-calendar text-indigo-500"></i> ${formatDateTime(agenda.datetime)}`;
            
            const notesContainer = document.getElementById('detail-notes');
            if (agenda.notes) {
                notesContainer.innerText = agenda.notes;
                notesContainer.classList.remove('italic', 'text-gray-400');
            } else {
                notesContainer.innerText = "Tidak ada catatan atau notulensi untuk agenda ini.";
                notesContainer.classList.add('italic', 'text-gray-400');
            }

            const relatedTasks = tasks.filter(t => t.relatedTopic && t.relatedTopic.toLowerCase() === agenda.title.toLowerCase());
            const tasksContainer = document.getElementById('detail-tasks');
            tasksContainer.innerHTML = '';

            if (relatedTasks.length === 0) {
                tasksContainer.innerHTML = `<p class="text-sm text-gray-500 italic">Tidak ada tugas spesifik dari rapat ini.</p>`;
            } else {
                relatedTasks.forEach(task => {
                    const item = document.createElement('div');
                    item.className = `bg-white border border-gray-200 p-3 rounded-lg flex items-center justify-between shadow-sm`;
                    item.innerHTML = `
                        <div class="flex items-center gap-3">
                            <button onclick="toggleTaskStatus('${task.id}')" class="transition-transform hover:scale-110 ${task.isDone ? 'text-emerald-500' : 'text-gray-300 hover:text-emerald-400'}">
                                <i class="ph-fill ${task.isDone ? 'ph-check-circle' : 'ph-circle'} text-xl"></i>
                            </button>
                            <div>
                                <p class="text-sm font-medium ${task.isDone ? 'text-gray-500 line-through' : 'text-gray-800'}">${task.title}</p>
                                <p class="text-xs text-gray-500"><i class="ph ph-clock"></i> Deadline: ${formatDateTime(task.deadline)}</p>
                            </div>
                        </div>
                    `;
                    tasksContainer.appendChild(item);
                });
            }

            document.getElementById('detail-modal').setAttribute('data-agenda-id', agendaId);
            openModal('detail-modal');
        }

        // Ekspos fungsi ke Window agar bisa diakses oleh onclick di HTML
        window.openModal = openModal;
        window.closeModals = closeModals;
        window.switchContext = switchContext;
        window.updateTaskFormUI = updateTaskFormUI;
        window.saveAgenda = saveAgenda;
        window.saveTask = saveTask;
        window.saveNote = saveNote;
        window.editAgenda = editAgenda;
        window.editTask = editTask;
        window.editNote = editNote;
        window.deleteAgenda = deleteAgenda;
        window.deleteTask = deleteTask;
        window.deleteNote = deleteNote;
        window.toggleTaskStatus = toggleTaskStatus;
        window.openDetailModal = openDetailModal;

        // Initialize App on Load
        window.onload = initApp;

    </script>
</body>
</html>
